# Builds and tests the engine and the Mac app on every pull request and push to main. The model files aren't fetched,
# so the reference-vector test skips itself; everything else runs. Also by hand: `gh workflow run ci.yml`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/llama
          key: llama-macos-${{ hashFiles('scripts/build-llama.sh') }}
      - name: llama.cpp
        run: scripts/build-llama.sh
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test

